name: Feature request
description: Propose a focused digital-human workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and tradeoffs
      description: Include effects on VRAM, host RAM, generation time, continuity, and compatibility.

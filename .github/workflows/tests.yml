name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Validate Python and workflow JSON
        run: |
          python -m compileall -q .
          python -m json.tool "example_workflows/MiniMaxH3 - Long Video Digital Human.json" >/dev/null
      - name: Run isolated regression suite
        run: python tests/run_tests.py
      - name: Verify release checksums
        run: python scripts/checksums.py --check
